<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlow AI - Minimum Viable Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .modal { display: none; background-color: rgba(0,0,0,0.5); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <!-- Header Navigation -->
    <header class="w-full bg-white shadow-md fixed top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">WorkFlow AI Test</h1>
            <nav id="nav-logged-out" class="space-x-2">
                <button id="login-nav-btn" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Log In</button>
                <button id="signup-nav-btn" class="bg-indigo-600 text-white text-sm font-bold px-3 py-1 rounded-md hover:bg-indigo-700">Sign Up</button>
            </nav>
            <nav id="nav-logged-in" class="hidden space-x-2 items-center">
                <span id="user-email-display" class="text-gray-600 text-sm"></span>
                <button id="logout-btn" class="bg-gray-200 text-gray-800 text-sm px-3 py-1 rounded-md hover:bg-gray-300">Log Out</button>
            </nav>
        </div>
    </header>

    <!-- Main Status Display -->
    <main class="text-center p-8 bg-white rounded-xl shadow-2xl mt-20">
        <h2 id="status-title" class="text-2xl font-extrabold text-gray-900 mb-4">Awaiting User Action</h2>
        <p id="status-message" class="text-gray-600">Please Log In or Sign Up to test the connection.</p>
        <p class="mt-4 text-sm text-indigo-500">
            Current Status: <span id="auth-status">Checking...</span>
        </p>
    </main>
    

    <!-- Login Modal -->
    <div id="login-modal" class="modal fixed inset-0 flex items-center justify-center z-20">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-xs">
            <h2 class="text-xl font-bold mb-4">Log In</h2>
            <p id="login-error" class="text-red-500 text-sm mb-3 hidden"></p>
            <input id="login-email" type="email" placeholder="Email" class="w-full p-2 border rounded-md mb-3">
            <input id="login-password" type="password" placeholder="Password" class="w-full p-2 border rounded-md mb-4">
            <button id="login-submit-btn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-md hover:bg-indigo-700">Log In</button>
            <p class="text-xs text-center mt-3">
                <a href="#" id="forgot-password-link" class="text-indigo-600 hover:underline">Forgot Password?</a>
            </p>
            <p class="text-xs text-center mt-2">
                No account? <a href="#" id="show-signup-link" class="text-indigo-600 hover:underline">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signup-modal" class="modal fixed inset-0 flex items-center justify-center z-20">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-xs">
            <h2 class="text-xl font-bold mb-4">Sign Up</h2>
            <p id="signup-error" class="text-red-500 text-sm mb-3 hidden"></p>
            <input id="signup-email" type="email" placeholder="Email" class="w-full p-2 border rounded-md mb-3">
            <input id="signup-password" type="password" placeholder="Password (min 6 chars)" class="w-full p-2 border rounded-md mb-4">
            <button id="signup-submit-btn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-md hover:bg-indigo-700">Create Account</button>
            <p class="text-xs text-center mt-3">
                Already have an account? <a href="#" id="show-login-link" class="text-indigo-600 hover:underline">Log In</a>
            </p>
        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="reset-modal" class="modal fixed inset-0 flex items-center justify-center z-20">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-xs">
            <h2 class="text-xl font-bold mb-4">Reset Password</h2>
            <p id="reset-error" class="text-red-500 text-sm mb-3 hidden"></p>
            <input id="reset-email" type="email" placeholder="Email" class="w-full p-2 border rounded-md mb-4">
            <button id="reset-submit-btn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-md hover:bg-indigo-700">Send Reset Link</button>
            <p class="text-xs text-center mt-3">
                <a href="#" id="back-to-login-link" class="text-indigo-600 hover:underline">Back to Log In</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- YOUR UNIQUE FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAt-eXoGMmloqEUPp4rjtkvytiPsHUDkQQ",
            authDomain: "workflow-ai-139be.firebaseapp.com",
            projectId: "workflow-ai-139be",
            storageBucket: "workflow-ai-139be.firebasestorage.app",
            messagingSenderId: "838393486765",
            appId: "1:838393486765:web:fd5842c1ea10f0b1dc1524"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- DOM Elements ---
        const loginModal = document.getElementById('login-modal');
        const signupModal = document.getElementById('signup-modal');
        const resetModal = document.getElementById('reset-modal');
        const navLoggedIn = document.getElementById('nav-logged-in');
        const navLoggedOut = document.getElementById('nav-logged-out');
        const authStatus = document.getElementById('auth-status');
        const statusTitle = document.getElementById('status-title');
        const statusMessage = document.getElementById('status-message');

        // --- AUTH STATE LISTENER ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Logged In
                authStatus.textContent = "LOGGED IN";
                navLoggedOut.style.display = 'none';
                navLoggedIn.style.display = 'flex';
                document.getElementById('user-email-display').textContent = user.email;
                statusTitle.textContent = "Welcome, " + user.email.split('@')[0] + "!";
                statusMessage.textContent = "Your authentication is working perfectly.";

                // Close all modals immediately upon successful login
                loginModal.style.display = 'none';
                signupModal.style.display = 'none';
                resetModal.style.display = 'none';

            } else {
                // Logged Out
                authStatus.textContent = "LOGGED OUT";
                navLoggedIn.style.display = 'none';
                navLoggedOut.style.display = 'flex';
                statusTitle.textContent = "Awaiting User Action";
                statusMessage.textContent = "Please Log In or Sign Up to test the connection.";
            }
        });

        // --- UTILITY: OPEN/CLOSE MODALS ---
        document.getElementById('login-nav-btn').onclick = () => loginModal.style.display = 'flex';
        document.getElementById('signup-nav-btn').onclick = () => signupModal.style.display = 'flex';

        window.onclick = (e) => {
            if (e.target === loginModal) loginModal.style.display = 'none';
            if (e.target === signupModal) signupModal.style.display = 'none';
            if (e.target === resetModal) resetModal.style.display = 'none';
        };

        // Internal Modal Links
        document.getElementById('show-signup-link').onclick = (e) => { e.preventDefault(); loginModal.style.display = 'none'; signupModal.style.display = 'flex'; };
        document.getElementById('show-login-link').onclick = (e) => { e.preventDefault(); signupModal.style.display = 'none'; loginModal.style.display = 'flex'; };
        document.getElementById('forgot-password-link').onclick = (e) => { e.preventDefault(); loginModal.style.display = 'none'; resetModal.style.display = 'flex'; };
        document.getElementById('back-to-login-link').onclick = (e) => { e.preventDefault(); resetModal.style.display = 'none'; loginModal.style.display = 'flex'; };

        // --- AUTH ACTIONS ---
        
        // Sign Up
        document.getElementById('signup-submit-btn').onclick = async () => {
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('signup-error');
            errorEl.style.display = 'none';
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                // Create minimal user doc (we only care that it logs them in)
                await setDoc(doc(db, "users", userCredential.user.uid), { email: userCredential.user.email, is_pro: false });
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        };

        // Log In
        document.getElementById('login-submit-btn').onclick = async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        };

        // Forgot Password
        document.getElementById('reset-submit-btn').onclick = async () => {
            const email = document.getElementById('reset-email').value;
            const errorEl = document.getElementById('reset-error');
            errorEl.style.display = 'none';
            if (!email) { errorEl.textContent = "Please enter your email."; errorEl.style.display = 'block'; return; }
            try {
                await sendPasswordResetEmail(auth, email);
                resetModal.style.display = 'none';
                alert(`Password reset link sent to ${email}. Check your inbox (including spam)!`);
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
            }
        };

        // Log Out
        document.getElementById('logout-btn').onclick = () => { signOut(auth); };
        
    </script>
</body>
</html>
